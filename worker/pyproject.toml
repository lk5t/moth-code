[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moth-worker"
version = "0.5.5"
description = "MOTH Worker: contribute GPU training compute to the MOTH training network"
requires-python = ">=3.10"
dependencies = ["moth-backend", "httpx>=0.27", "numpy>=1.24"]

[project.scripts]
moth-worker = "moth_worker.cli:main"

[tool.setuptools.packages.find]
include = ["moth_worker*"]

[tool.setuptools.package-data]
moth_worker = ["*.pub"]
