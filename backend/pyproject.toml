[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moth-backend"
version = "0.7.2"
description = "MOTH Code backend: MOTH model, training, autonomous coding engine and local API server"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
datasets = ["datasets>=2.18"]
dev = ["pytest>=8", "pytest-timeout>=2.2"]
package = ["pyinstaller>=6.5", "datasets>=2.18"]

[project.scripts]
moth = "moth.cli:main"

[tool.setuptools.packages.find]
include = ["moth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = ["slow: longer-running training tests"]
