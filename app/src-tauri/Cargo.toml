[package]
name = "moth-code"
version = "0.5.5"
description = "MOTH Code — independent AI coding agent"
authors = ["MOTH Code contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "moth_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
