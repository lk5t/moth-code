[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moth-server"
version = "0.5.0"
description = "MOTH Server: accounts, billing, referrals, training coordinator and model registry"
requires-python = ">=3.10"
dependencies = [
  "moth-backend",          # shared MOTH model/training/validation code (../backend)
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-timeout>=2.2"]

[project.scripts]
moth-server = "moth_server.cli:main"

[tool.setuptools.packages.find]
include = ["moth_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
