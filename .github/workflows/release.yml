name: Desktop release

# Publishes MOTH Code for Windows, separately from server releases (server-release.yml):
#   full CI → Windows auto-update end-to-end test → installer + signed updater artifacts →
#   signed desktop manifest → GitHub release "desktop-vX.Y.Z".
# The MOTH Cloud update agent relays the release to the server, which offers it to desktops in stages;
# desktops download, verify and install it themselves. It never changes the server itself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Desktop release tag (must match the app version, e.g. desktop-v0.3.1)"
        required: true
        default: "desktop-v0.5.6"
      channel:
        description: "Update channel"
        required: true
        default: "stable"
        type: choice
        options: [stable, beta]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_CHANNEL: ${{ inputs.channel }}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  update-test:
    needs: tests
    uses: ./.github/workflows/desktop-update-test.yml

  windows:
    needs: update-test
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Python backend (PyInstaller, CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "./backend[package]" ./worker  # MOTH Code can contribute its computer (0.5.3)
          python -m pip install ./server pywinauto  # isolated native GENESIS API/UI verification
          cd backend
          pyinstaller --noconfirm --distpath dist packaging/moth-backend.spec
      - name: Smoke-test the frozen backend
        shell: pwsh
        run: |
          $exe = "backend/dist/moth-backend/moth-backend.exe"
          $env:MOTH_HOME = "$env:RUNNER_TEMP/moth-smoke"
          $p = Start-Process -FilePath $exe -RedirectStandardOutput "$env:RUNNER_TEMP/out.txt" -RedirectStandardError "$env:RUNNER_TEMP/err.txt" -PassThru -NoNewWindow
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path "$env:RUNNER_TEMP/out.txt") -and (Select-String -Path "$env:RUNNER_TEMP/out.txt" -Pattern "MOTH_BACKEND_READY" -Quiet)) { $ready = $true; break }
          }
          Get-Content "$env:RUNNER_TEMP/out.txt"
          if (-not $ready) { Get-Content "$env:RUNNER_TEMP/err.txt"; Stop-Process -Id $p.Id -Force; throw "frozen backend did not start" }
          $port = ((Select-String -Path "$env:RUNNER_TEMP/out.txt" -Pattern '"port": (\d+)').Matches[0].Groups[1].Value)
          $subs = Invoke-RestMethod "http://127.0.0.1:$port/api/subsystems"
          $subs | ConvertTo-Json -Depth 4
          Stop-Process -Id $p.Id -Force
          foreach ($s in $subs.PSObject.Properties) { if (-not $s.Value.ok) { throw "subsystem $($s.Name) failed: $($s.Value.error)" } }
      - name: Stage backend as a Tauri resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/resources | Out-Null
          Copy-Item -Recurse backend/dist/moth-backend app/src-tauri/resources/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - name: Prepare release configuration (official endpoint, updater)
        run: node scripts/prepare-release.mjs
        env:
          MOTH_CLOUD_URL: ${{ vars.MOTH_CLOUD_URL }}
          MOTH_STAGING_URL: ${{ vars.MOTH_STAGING_URL }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      - name: Build the installer (and signed updater artifacts)
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify native GENESIS launch, workspace, worker controls and CPU scheduling
        shell: pwsh
        run: |
          $installer = (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe)[0].FullName
          python scripts/test-genesis-desktop.py --installer "$installer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-desktop-verification
          path: |
            ${{ runner.temp }}/genesis-desktop-test/evidence.json
            ${{ runner.temp }}/genesis-desktop-test/cloud.log
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography sqlalchemy fastapi
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: desktop
      - name: Signed desktop release manifest
        env:
          MOTH_RELEASE_SIGNING_KEY: ${{ secrets.MOTH_RELEASE_SIGNING_KEY }}
        run: |
          EXE="$(ls desktop/*-setup.exe | head -1)"
          [ -f "$EXE.sig" ] || { echo "::error::the installer has no updater signature (TAURI_SIGNING_PRIVATE_KEY secret)"; exit 1; }
          python scripts/build-release.py --kind desktop --desktop "$EXE" --out dist --channel "$RELEASE_CHANNEL" --notes "MOTH Code ${RELEASE_TAG#desktop-v}"
          python scripts/verify-release.py dist
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the GitHub release (never replaces an existing one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo "::error::release $RELEASE_TAG already exists"; exit 1; fi
          V="${RELEASE_TAG#desktop-v}"
          sed "s|__REF__|${RELEASE_TAG}|g; s|__VERSION__|${V}|g" .github/desktop-release-notes.md > notes.md
          PRE=""; [ "$RELEASE_CHANNEL" != "stable" ] && PRE="--prerelease"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" $PRE --title "MOTH Code ${V} (desktop)" --notes-file notes.md dist/*
