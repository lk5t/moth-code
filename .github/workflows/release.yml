name: Release

# One approved release = one signed set of artifacts for every component:
#   tests (full CI) → Windows desktop installer + signed updater artifacts → cloud bundle + worker bundle →
#   signed release manifest → GitHub release.
# MOTH Cloud's update agent picks the release up from here, verifies the signature, updates the
# server, and distributes the desktop and worker updates to clients in stages. Nothing is deployed
# from arbitrary commits: only this workflow, started by the Owner, produces signed releases.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match the version in the code, e.g. v0.3.0)"
        required: true
        default: "v0.3.0"
      channel:
        description: "Update channel"
        required: true
        default: "stable"
        type: choice
        options: [stable, beta]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_CHANNEL: ${{ inputs.channel }}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Python backend (PyInstaller, CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "./backend[package]"
          cd backend
          pyinstaller --noconfirm --distpath dist packaging/moth-backend.spec
      - name: Smoke-test the frozen backend
        shell: pwsh
        run: |
          $exe = "backend/dist/moth-backend/moth-backend.exe"
          $env:MOTH_HOME = "$env:RUNNER_TEMP/moth-smoke"
          $p = Start-Process -FilePath $exe -RedirectStandardOutput "$env:RUNNER_TEMP/out.txt" -RedirectStandardError "$env:RUNNER_TEMP/err.txt" -PassThru -NoNewWindow
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path "$env:RUNNER_TEMP/out.txt") -and (Select-String -Path "$env:RUNNER_TEMP/out.txt" -Pattern "MOTH_BACKEND_READY" -Quiet)) { $ready = $true; break }
          }
          Get-Content "$env:RUNNER_TEMP/out.txt"
          if (-not $ready) { Get-Content "$env:RUNNER_TEMP/err.txt"; Stop-Process -Id $p.Id -Force; throw "frozen backend did not start" }
          $port = ((Select-String -Path "$env:RUNNER_TEMP/out.txt" -Pattern '"port": (\d+)').Matches[0].Groups[1].Value)
          $subs = Invoke-RestMethod "http://127.0.0.1:$port/api/subsystems"
          $subs | ConvertTo-Json -Depth 4
          Stop-Process -Id $p.Id -Force
          foreach ($s in $subs.PSObject.Properties) { if (-not $s.Value.ok) { throw "subsystem $($s.Name) failed: $($s.Value.error)" } }
      - name: Stage backend as a Tauri resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/resources | Out-Null
          Copy-Item -Recurse backend/dist/moth-backend app/src-tauri/resources/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: app
      - name: Prepare release configuration (official endpoint, updater)
        run: node scripts/prepare-release.mjs
        env:
          MOTH_CLOUD_URL: ${{ vars.MOTH_CLOUD_URL }}
          MOTH_STAGING_URL: ${{ vars.MOTH_STAGING_URL }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      - name: Build the installer (and signed updater artifacts)
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography sqlalchemy fastapi
      - uses: actions/download-artifact@v4
        with:
          name: desktop
          path: desktop
      - name: Build cloud and worker bundles and the signed release manifest
        env:
          MOTH_RELEASE_SIGNING_KEY: ${{ secrets.MOTH_RELEASE_SIGNING_KEY }}
        run: |
          EXE="$(ls desktop/*-setup.exe | head -1)"
          ARGS=(--out dist --channel "$RELEASE_CHANNEL" --notes "MOTH ${RELEASE_TAG#v}")
          if [ -f "$EXE.sig" ]; then ARGS+=(--desktop "$EXE"); else echo "::warning::desktop installer is not signed for updates; it is attached for manual installation only"; fi
          python scripts/build-release.py "${ARGS[@]}"
          [ -f "$EXE.sig" ] || cp "$EXE" "dist/$(basename "$EXE" | tr ' ' '.')"  # unsigned: manual install only
          ls -la dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed "s|__REF__|${RELEASE_TAG}|g" .github/release-notes.md > notes.md
          PRE=""; [ "$RELEASE_CHANNEL" != "stable" ] && PRE="--prerelease"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" $PRE --title "MOTH Code ${RELEASE_TAG}" --notes-file notes.md dist/*
          fi
