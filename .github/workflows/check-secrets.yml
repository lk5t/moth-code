name: Check release secrets

# Verifies the release signing secrets without printing them: reports set/missing and whether each
# key matches the public key committed in the repository. Run it from Actions → "Check release
# secrets" → Run workflow (it also runs once when this file changes).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-secrets.yml"
      - "scripts/check-release-secrets.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet cryptography
      - name: Sign a test file with the updater key (output discarded)
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "MOTH update signing test $GITHUB_RUN_ID" > "$RUNNER_TEMP/msg.txt"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri signer sign "$RUNNER_TEMP/msg.txt" >/dev/null 2>&1 || true
          fi
      - name: Check secrets (prints only set/missing and match results)
        env:
          MOTH_RELEASE_SIGNING_KEY: ${{ secrets.MOTH_RELEASE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MOTH_CLOUD_URL: ${{ vars.MOTH_CLOUD_URL }}
        run: python scripts/check-release-secrets.py "$RUNNER_TEMP/msg.txt" "$RUNNER_TEMP/msg.txt.sig"
