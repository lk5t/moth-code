name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # the release workflow runs the full test suite before building anything

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install PyTorch (CPU) and backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "./backend[dev]"
      - name: Configure git identity for git tests
        run: |
          git config --global user.email "ci@moth.invalid"
          git config --global user.name "MOTH CI"
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  server:
    name: MOTH Server tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moth
          POSTGRES_PASSWORD: moth-ci-only
          POSTGRES_DB: moth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moth" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            server/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./backend -e "./server[dev,postgres]"
      - name: Run tests
        working-directory: server
        env:
          MOTH_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://moth:moth-ci-only@localhost:5432/moth_test' || '' }}
        run: python -m pytest -q

  worker-install:
    name: MOTH Worker one-command install (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies (CPU PyTorch; the runner has no GPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./backend -e ./server
      - name: Enrollment command → verified download → install → verified training job
        run: bash scripts/test-worker-install.sh

  cloud-updates:
    name: MOTH Cloud install, automatic updates, rollback and recovery (Linux, real processes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the test starts a real v0.2.1 server from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./backend -e ./server httpx
      - name: v0.2.1 adoption → install → server/agent/worker updates → rollback → recovery → reboot
        run: python scripts/test-ecosystem-update.py

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/dist

  desktop:
    name: Desktop shell (${{ matrix.os }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/dist
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Rust tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
