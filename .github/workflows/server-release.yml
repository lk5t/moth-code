name: Server release

# Publishes the MOTH Cloud server release (cloud bundle + worker bundle + signed manifest) without a
# desktop build. Full CI runs first; the manifest is signed with the MOTH_RELEASE_SIGNING_KEY secret
# and verified before anything is published. An existing release is never overwritten.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Server release tag (must match the server version, e.g. server-v0.3.1)"
        required: true
        default: "server-v0.6.4"
      publish:
        description: "Publish to GitHub Releases (requires explicit Owner approval; false builds verified candidates only)"
        type: boolean
        required: true
        default: false
      channel:
        description: "Update channel"
        required: true
        default: "stable"
        type: choice
        options: [stable, beta]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet cryptography sqlalchemy fastapi
      - name: Version check
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/moth_server/__init__.py)
          T="${TAG#server-}"; [ "v$V" = "$T" ] || { echo "::error::tag $TAG does not match server version $V"; exit 1; }
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::release $TAG already exists"; exit 1; fi
      - name: Build bundles and sign the manifest
        env:
          MOTH_RELEASE_SIGNING_KEY: ${{ secrets.MOTH_RELEASE_SIGNING_KEY }}
        run: python scripts/build-release.py --kind server --out dist --channel "$CHANNEL" --notes "MOTH Cloud ${TAG#server-v}"
      - name: Verify signature, checksums and bundle contents
        run: python scripts/verify-release.py dist
      - name: SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-server-worker-candidate
          path: dist/*
          if-no-files-found: error
      - name: Publish the GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${TAG#server-}"; V="${V#v}"
          sed "s|__REF__|${TAG}|g; s|__VERSION__|${V}|g" .github/server-release-notes.md > notes.md
          PRE=""; [ "$CHANNEL" != "stable" ] && PRE="--prerelease"
          gh release create "$TAG" --target "$GITHUB_SHA" $PRE --title "MOTH Cloud ${V} (server)" --notes-file notes.md dist/*
